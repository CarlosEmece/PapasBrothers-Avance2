<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Papas Broather</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/contacto.css}">
</head>

<body>

    <!-- Navbar --> 
    <nav th:replace="~{componentes/navbar :: nav-bar}"></nav>


    <!-- FORMULARIO DE CONTACTO -->
    <div class="container my-5">
        <div class="form-container p-4 shadow rounded animate-fadeIn">
            <img th:src="@{/img/LogoPapaB.png}" alt="Logo" class="logo mx-auto d-block mb-3">
            <form class="contact-form" th:action="@{/contactos/enviar}" method="post">
                <h2 class="text-center mb-3">Contacto</h2>
                <p class="text-center mb-4">Si tienes alguna duda o sugerencia, contáctate con nosotros.</p>

                <div class="mb-3">
                    <label class="form-label">Nombre y apellido *</label>
                    <input type="text" class="form-control" name="nombreApellido" required
                        pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$" title="Solo letras y espacios permitidos.">
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo electrónico *</label>
                    <input type="email" class="form-control" name="correo" required
                        pattern="^[a-zA-Z0-9ñÑ._%+-]+@[a-zA-Z0-9ñÑ.-]+\.[a-zA-Z]{2,}$"
                        title="El correo no debe contener espacios ni símbolos extraños, pero la 'ñ' está permitida.">
                </div>

                <div class="mb-3">
                    <label class="form-label">Teléfono *</label>
                    <input type="tel" class="form-control" name="telefono" required pattern="^\d{9}$"
                        title="El número debe contener exactamente 9 dígitos.">

                </div>


                <div class="mb-3">
                    <label class="form-label">Motivo *</label>
                    <select class="form-select" name="motivo" required>
                        <option value="">Selecciona el motivo</option>
                        <option value="queja">Queja</option>
                        <option value="sugerencia">Sugerencia</option>
                        <option value="consulta">Consulta</option>
                    </select>
                    <div class="form-text text-danger">Rellenar este campo.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción *</label>
                    <textarea class="form-control" name="descripcion" required></textarea>
                </div>

                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="novedades" name="novedades">
                    <label class="form-check-label" for="novedades">
                        Acepto recibir información sobre las novedades y promociones de Papas Brother
                    </label>
                </div>

                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="privacidad" name="privacidad" required>
                    <label class="form-check-label" for="privacidad">
                        Acepto la Política de Privacidad
                    </label>
                </div>

                <a href="#" class="d-block mb-3 text-decoration-none">Política de Privacidad</a>

                <button type="submit" class="btn btn-warning w-100 btn-animate">
                    <i class="fa fa-save"></i> Enviar
                </button>
            </form>
        </div>
    </div>



    <!-- Footer -->
   <div th:replace="~{componentes/footer :: footer}"></div>


    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
