<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario de Compra</title>
</head>
<body>
    <h1>Formulario de Compra</h1>
    <form th:action="@{/compras/guardar}" th:object="${compra}" method="post">
        <input type="hidden" th:field="*{idCompras}" />
        <label>Cliente:</label>
        <select th:field="*{cliente}">
            <option th:each="cli : ${clientes}" th:value="${cli}" th:text="${cli.nombres}"></option>
        </select><br/>
        <label>Pago:</label>
        <select th:field="*{pago}">
            <option th:each="p : ${pagos}" th:value="${p}" th:text="'S/ ' + ${p.monto}"></option>
        </select><br/>
        <label>Monto:</label>
        <input type="number" step="0.01" th:field="*{monto}" required/><br/>
        <label>Estado:</label>
        <input type="text" th:field="*{estado}" /><br/>
        <button type="submit">Guardar</button>
    </form>
    <a th:href="@{/compras}">Volver</a>
</body>
</html>
