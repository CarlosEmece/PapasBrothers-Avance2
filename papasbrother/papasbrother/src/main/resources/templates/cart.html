<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Carrito de Compras</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Rubik', sans-serif;
      background: linear-gradient(to right, #f8ffae, #43c6ac);
      min-height: 100vh;
      padding-top: 40px;
    }

    section.container {
      background-color: #fff;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      animation: fadeInUp 1s ease-in-out;
    }

    h2 {
      color: #ff5e5e;
      font-weight: 600;
      text-align: center;
      margin-bottom: 30px;
    }

    table {
      background-color: #fff;
    }

    th {
      background-color: #ffdd59;
      color: #000;
    }

    td,
    th {
      text-align: center;
      vertical-align: middle;
    }

    .btn-danger {
      background-color: #ff6b6b;
      border: none;
    }

    .btn-danger:hover {
      background-color: #ff4757;
    }

    .btn-success {
      background-color: #1dd1a1;
      border: none;
      transition: transform 0.3s ease;
    }

    .btn-success:hover {
      background-color: #10ac84;
      transform: scale(1.05);
    }

    h4 {
      text-align: right;
      margin-top: 20px;
      color: #222f3e;
      font-weight: bold;
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <section class="container">
    <h2>🛒 Tu Carrito</h2>

    <table class="table table-hover">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Precio</th>
          <th>Cantidad</th>
          <th>Subtotal</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="item : ${cart.items}">
          <td th:text="${item.producto.nombre}">Nombre</td>
          <td th:text="${#numbers.formatDecimal(item.producto.precio,1,2)}">0.00</td>
          <td th:text="${item.cantidad}">1</td>
          <td th:text="${#numbers.formatDecimal(item.subtotal,1,2)}">0.00</td>
          <td>
            <a th:href="@{/cart/remove/{id}(id=${item.producto.id})}" class="btn btn-sm btn-danger">❌ Eliminar</a>
          </td>
        </tr>

      </tbody>
    </table>

    <h4>Total: S/ <span th:text="${#numbers.formatDecimal(cart.total,1,2)}">0.00</span></h4>
    


    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-3">
      <a th:href="@{/boleta}" class="btn btn-success btn-lg">💳 Pagar y Descargar Boleta</a>
    </div>
  </section>

</body>

</html>
