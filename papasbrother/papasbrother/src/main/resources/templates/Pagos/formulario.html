<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario de Pago</title>
</head>
<body>
    <h1 th:text="${pago.idPago != null ? 'Editar Pago' : 'Nuevo Pago'}"></h1>
    <form th:action="@{/pagos/guardar}" th:object="${pago}" method="post">
        <input type="hidden" th:field="*{idPago}" />
        <label>Monto:</label>
        <input type="number" step="0.01" th:field="*{monto}" required/><br/>
        <button type="submit">Guardar</button>
    </form>
    <a th:href="@{/pagos}">Volver</a>
</body>
</html>
