<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Producto</title>
</head>
<body>
    <h1 th:text="${producto.idProducto} != null ? 'Editar Producto' : 'Nuevo Producto'"></h1>
    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
        <input type="hidden" th:field="*{idProducto}" />
        <label>Nombre:</label><input type="text" th:field="*{nombres}" /><br/>
        <label>Descripción:</label><input type="text" th:field="*{descripcion}" /><br/>
        <label>Precio:</label><input type="number" step="0.01" th:field="*{precio}" /><br/>
        <label>Stock:</label><input type="number" th:field="*{stock}" /><br/>
        <button type="submit">Guardar</button>
    </form>
    <a th:href="@{/productos}">Volver a la lista</a>
</body>
</html>
