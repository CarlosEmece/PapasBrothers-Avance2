<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Papas Broather</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/registro.css}">
</head>

<body>


    <!-- Navbar --> 
    <nav th:replace="~{componentes/navbar :: nav-bar}"></nav>


    <!-- REGISTRO -->

    <section class="registro-section py-5" style="margin-top: 120px;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg p-4 border-0 rounded-4">
                    <h3 class="text-center mb-4" style="font-family: 'Righteous', cursive; color: orange;">Crear Cuenta</h3>
                    <!-- Aquí se muestra el mensaje de error si existe -->
                    <div th:if="${errorMessage}" class="alert alert-danger">
                        <p th:text="${errorMessage}"></p>
                    </div>
                    <form action="/usuarios/registro/enviar" method="post">
                        <div class="mb-3">
                            <label for="nombreCompleto" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="nombreCompleto" name="nombreCompleto"
                                placeholder="Ingresa tu nombre completo" required
                                pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$"
                                title="El nombre solo puede contener letras y espacios.">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo</label>
                            <input type="email" class="form-control" id="email" name="email"
                                placeholder="correo@ejemplo.com" required
                                pattern="^[a-zA-Z0-9ñÑ._%+-]+@[a-zA-Z0-9ñÑ.-]+\.[a-zA-Z]{2,}$"
                                title="El correo no debe contener espacios ni símbolos extraños, pero la 'ñ' está permitida.">
                        </div>
                        <div class="mb-3">
                            <label for="contraseña" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="contraseña" name="password"
                                placeholder="Mínimo 8 caracteres" minlength="8" required
                                pattern="^[a-zA-Z0-9ñÑ!@#$%^&*()-_+=]+$"
                                title="La contraseña solo puede contener letras, números y algunos caracteres especiales.">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark">Crear Cuenta</button>
                        </div>
                        <div class="text-center mt-3">
                            <span>¿Ya tienes una cuenta?</span>
                            <a href="/login" class="text-decoration-none" style="color: #FF5733;">Inicia sesión</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>


    <!-- Footer -->
   <div th:replace="~{componentes/footer :: footer}"></div>
    
    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
