<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Boleta de Pedido</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      color: #333;
    }
    .empresa {
      text-align: center;
      margin-bottom: 20px;
    }
    .empresa img {
      max-width: 80px;
      display: block;
      margin: 0 auto;
    }
    .empresa h1 {
      color: #FFCA1A;
      margin: 10px 0;
    }
    .datos-boleta {
      text-align: center;
      font-size: 14px;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
      font-size: 13px;
    }
    th {
      background-color: #f3f3f3;
    }
    .resumen {
      margin-top: 30px;
      text-align: right;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="empresa">
    <!-- Se asume que el logo está en la carpeta /img, lo ajustamos con Thymeleaf -->
    <img th:src="@{/img/logoComoPaPobre.png}" alt="Logo de PapasBrother">
    <h1 th:text="${empresa}">PapasBrother</h1>
  </div>
  
  <div class="datos-boleta">
    <p><strong>Boleta N°:</strong> <span th:text="${numero}">PED-XXXX</span></p>
    <p><strong>Fecha:</strong> <span th:text="${fecha}">dd/MM/yyyy HH:mm</span></p>
    <p><strong>Cliente:</strong> <span th:text="${usuario}">usuario</span></p>
  </div>
  
  <table>
    <thead>
      <tr>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>P. Unitario</th>
        <th>Subtotal</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="item : ${items}">
        <td th:text="${item.nombre}">Nombre del producto</td>
        <td th:text="${item.cantidad}">1</td>
        <td th:text="${item.precio}">00.00</td>
        <td th:text="${item.precio * item.cantidad}">00.00</td>
      </tr>
    </tbody>
  </table>
  
  <div class="resumen">
    Total: S/. <span th:text="${total}">00.00</span>
  </div>
</body>
</html>
